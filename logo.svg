<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="zaistaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E63946" />
      <stop offset="100%" stop-color="#C1121F" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A9D8F" />
      <stop offset="100%" stop-color="#264653" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1A1F2C" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background Badge (Optional) -->
  <circle cx="50" cy="50" r="46" fill="#FFF8E7" stroke="#E63946" stroke-width="2.5" />
  <!-- Z-shaped Spoon Concept: Elegant curved spoon bowl forming top bar of Z, diagonal dynamic shaft, and handle base with herb flourish -->
  <!-- Spoon Bowl (top arm of Z) -->
  <path d="M 28 32 C 34 22, 54 22, 68 28 C 72 30, 74 34, 70 38 C 65 42, 54 40, 48 37 Z" fill="url(#zaistaGrad)" filter="url(#shadow)" />
  <!-- Diagonal Z Stem (spoon neck) -->
  <path d="M 66 32 L 34 68 C 31 71, 35 75, 38 72 L 70 36 C 73 33, 69 29, 66 32 Z" fill="url(#zaistaGrad)" />
  <!-- Bottom Base of Z (handle with leaf accent) -->
  <path d="M 32 68 C 38 68, 54 68, 72 68 C 76 68, 76 74, 71 74 C 54 74, 38 74, 28 74 C 24 74, 25 68, 32 68 Z" fill="url(#zaistaGrad)" />
  <!-- Gourmet Garnish (Herbal Leaf in Vibrant Green) -->
  <path d="M 68 28 C 76 22, 82 26, 78 34 C 74 36, 70 32, 68 28 Z" fill="url(#accentGrad)" />
  <circle cx="50" cy="50" r="3.5" fill="#2A9D8F" />
</svg>